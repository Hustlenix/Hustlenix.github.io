name: Publish Chandra mobile visibility fix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-chandra-mobile-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public site
        uses: actions/checkout@v4

      - name: Download compiled mobile-fixed portfolio
        env:
          ARTIFACT_URL: "https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-56f8-81fa-a6a8-22629d581ee5/raw?se=2026-10-01T16%3A46%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=f5737730-18c6-500a-a2c6-39ddce2e917b&skoid=27fbae2c-124f-4566-a0d8-1b07a5a41c53&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T16%3A39%3A41Z&ske=2026-10-02T16%3A39%3A41Z&sks=b&skv=2026-02-06&sig=DJ%2BF8jPaHDlvcgKbSe5ua7ooRjhK/6IGqvaFu%2BQufGA%3D"
        run: |
          rm -rf chandra_choodeshwaran
          mkdir -p chandra_choodeshwaran
          curl -fL "$ARTIFACT_URL" -o /tmp/chandra-mobile-visibility-out.zip
          unzip -q /tmp/chandra-mobile-visibility-out.zip -d chandra_choodeshwaran
          touch .nojekyll

      - name: Commit mobile readability fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chandra_choodeshwaran .nojekyll
          if git diff --cached --quiet; then
            echo "No preview changes to publish"
          else
            git commit -m "Publish Chandra mobile readability fix"
            git push
          fi
