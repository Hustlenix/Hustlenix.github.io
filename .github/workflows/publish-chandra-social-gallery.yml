name: Publish Chandra social gallery preview

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-chandra-social-gallery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public site
        uses: actions/checkout@v4

      - name: Download compiled portfolio
        env:
          ARTIFACT_URL: "https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-3c64-81fa-b279-ee1c40d292c1/raw?se=2026-10-01T16%3A37%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=5c4ab63f-b866-532e-a849-4ed770ea5c50&skoid=27fbae2c-124f-4566-a0d8-1b07a5a41c53&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T15%3A49%3A53Z&ske=2026-10-02T15%3A49%3A53Z&sks=b&skv=2026-02-06&sig=HaMA8dHPxte5L25U6aIKQebTS9QHn6arAuxSYYYPmNI%3D"
        run: |
          rm -rf chandra_choodeshwaran
          mkdir -p chandra_choodeshwaran
          curl -fL "$ARTIFACT_URL" -o /tmp/chandra-social-gallery-out.zip
          unzip -q /tmp/chandra-social-gallery-out.zip -d chandra_choodeshwaran
          touch .nojekyll

      - name: Commit image-rich portfolio preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chandra_choodeshwaran .nojekyll
          if git diff --cached --quiet; then
            echo "No preview changes to publish"
          else
            git commit -m "Publish Chandra social image gallery preview"
            git push
          fi
