name: Publish Chandra final handoff preview

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-chandra-final-handoff.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public site
        uses: actions/checkout@v4

      - name: Download final compiled portfolio
        env:
          ARTIFACT_URL: "https://sdmntprnznorth.oaiusercontent.com/files/00000000-cdb0-820b-9fef-c0f32411cac0/raw?se=2026-10-01T16%3A57%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=6d5f1c86-787e-5494-bc6d-9a7822dd65a5&skoid=27fbae2c-124f-4566-a0d8-1b07a5a41c53&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T15%3A48%3A07Z&ske=2026-10-02T15%3A48%3A07Z&sks=b&skv=2026-02-06&sig=/l0%2BB8Y2GofIThCFBGLb2wqtEzVnMAyU9ZQ0iUG2oAU%3D"
        run: |
          rm -rf chandra_choodeshwaran
          mkdir -p chandra_choodeshwaran
          curl -fL "$ARTIFACT_URL" -o /tmp/chandra-final-handoff-out.zip
          unzip -q /tmp/chandra-final-handoff-out.zip -d chandra_choodeshwaran
          touch .nojekyll

      - name: Commit final handoff preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chandra_choodeshwaran .nojekyll
          if git diff --cached --quiet; then
            echo "No preview changes to publish"
          else
            git commit -m "Publish Chandra final handoff preview"
            git push
          fi
