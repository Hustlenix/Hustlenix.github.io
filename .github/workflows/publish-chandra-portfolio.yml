name: Publish Chandra portfolio preview

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-chandra-portfolio.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public site
        uses: actions/checkout@v4

      - name: Download compiled portfolio
        env:
          ARTIFACT_URL: "https://sdmntprseasia.oaiusercontent.com/files/00000000-d38c-8207-8a1c-42a9983dd556/raw?se=2026-10-01T16%3A17%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=d9e46620-4121-569f-bd3e-1e5437558e2a&skoid=27fbae2c-124f-4566-a0d8-1b07a5a41c53&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T16%3A07%3A47Z&ske=2026-10-02T16%3A07%3A47Z&sks=b&skv=2026-02-06&sig=P1YpbDxLMfufgSQiKTSApqm398MmQpnu1skv402h8A4%3D"
        run: |
          rm -rf chandra_choodeshwaran
          mkdir -p chandra_choodeshwaran
          curl -fL "$ARTIFACT_URL" -o /tmp/chandra-portfolio-out.zip
          unzip -q /tmp/chandra-portfolio-out.zip -d chandra_choodeshwaran
          touch .nojekyll

      - name: Commit portfolio preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chandra_choodeshwaran .nojekyll
          if git diff --cached --quiet; then
            echo "No preview changes to publish"
          else
            git commit -m "Publish Chandra personal portfolio preview"
            git push
          fi
