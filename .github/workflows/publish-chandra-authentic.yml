name: Publish Chandra authentic portfolio preview

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-chandra-authentic.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public site
        uses: actions/checkout@v4

      - name: Download compiled portfolio
        env:
          ARTIFACT_URL: "https://sdmntprwestus.oaiusercontent.com/files/00000000-1ecc-8230-9c98-a95afb42f63b/raw?se=2026-10-01T16%3A31%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=4e0680fa-6491-5cbb-9bb5-791d29a8cff2&skoid=27fbae2c-124f-4566-a0d8-1b07a5a41c53&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T16%3A20%3A35Z&ske=2026-10-02T16%3A20%3A35Z&sks=b&skv=2026-02-06&sig=9/FdPGPsBV13ilqqfEwz1gU2R9COIhto%2BsuMOm0nenE%3D"
        run: |
          rm -rf chandra_choodeshwaran
          mkdir -p chandra_choodeshwaran
          curl -fL "$ARTIFACT_URL" -o /tmp/chandra-authentic-out.zip
          unzip -q /tmp/chandra-authentic-out.zip -d chandra_choodeshwaran
          touch .nojekyll

      - name: Commit authentic portfolio preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chandra_choodeshwaran .nojekyll
          if git diff --cached --quiet; then
            echo "No preview changes to publish"
          else
            git commit -m "Publish Chandra authentic portfolio preview"
            git push
          fi
